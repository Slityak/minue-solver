[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minue-solver"
version = "0.4.0"
description = "%%solve IPython magic that turns an exercise written in comments into short, runnable Python code"
requires-python = ">=3.9"
dependencies = ["ipython>=7", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
